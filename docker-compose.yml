version: "3.9"

services:
  exam:
    build: .
    image: examsystem:latest
    container_name: exam-app
    ports:
      - "8000:8000"
    volumes:
      # 配置文件：宿主改 config.yaml 后重启即可生效（注意 CorsMiddleware 等启动时定型项需重启）
      - ./config.yaml:/app/config.yaml:ro
      # 数据目录：多专业试卷 data/papers + exam.db（可写，便于管理端录入）
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - RERANK_USE_REMOTE=${RERANK_USE_REMOTE:-false}
      - RERANK_API_URL=${RERANK_API_URL:-}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - RERANK_MODEL=${RERANK_MODEL:-}
    restart: unless-stopped
