<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>企业考试</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="exam-page">
  <main class="exam-shell">
    <section class="exam-hero">
      <div class="hero-panel">
        <p class="eyebrow">ONLINE EXAM</p>
        <h1 id="title">企业考试</h1>
        <p id="desc" class="muted"></p>
      </div>
      <div class="timer-card" aria-live="polite">
        <div>
          <div class="timer-label">剩余时间</div>
          <div class="timer" id="timer">--:--</div>
          <div class="draft-status muted" id="draftStatus">未保存</div>
        </div>
      </div>
    </section>

    <section class="panel exam-intake" id="login">
      <div class="section-head">
        <div>
          <p class="eyebrow">CANDIDATE</p>
          <h2>考生信息</h2>
        </div>
      </div>
      <div class="form-grid">
        <label>
          姓名
          <input id="name" type="text" placeholder="请输入姓名" autocomplete="name">
        </label>
        <label>
          工号
          <input id="employee_id" type="text" placeholder="请输入工号" autocomplete="off">
        </label>
        <label>
          部门
          <input id="department" type="text" placeholder="可选" autocomplete="organization">
        </label>
      </div>
      <p class="muted form-note">点击开始后计时，提交后不展示分数，请等待管理员复核。</p>
      <button class="btn" id="startBtn" type="button">开始答题</button>
    </section>

    <form class="panel exam-form" id="examForm" style="display:none">
      <div class="section-head">
        <div>
          <p class="eyebrow">QUESTIONS</p>
          <h2>试题</h2>
        </div>
        <button class="btn" type="submit" id="submitBtn">提交试卷</button>
      </div>
      <div id="questions"></div>
    </form>

    <section class="panel result-panel" id="successPanel" style="display:none">
      <div id="resultContent" class="result-content"></div>
      <p class="muted form-note">如有疑问请联系系统管理员 | <a href="/admin">管理后台</a></p>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <button class="back-to-top" id="backToTop" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10l5-5 5 5"/>
    </svg>
  </button>
  <script src="/js/exam.js?v=20260805-back-to-top"></script>
</body>
</html>
