# docker-compose.prod.yml - 生产容器化部署 (Linux 服务器)
#
# 三服务: postgres(独立) / exam(Go API) / worker(Python 评分, 可独立伸缩)
# 详细步骤见 docs/deployment-docker.md
#
# 快速开始:
#   cp .env.production.example .env
#   cp config.production.example.yaml config.production.yaml
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d postgres
#   docker compose -f docker-compose.prod.yml run --rm exam migrate --config /app/config.yaml
#   docker compose -f docker-compose.prod.yml up -d
#
# 约定:
#   - 密钥只经 .env 注入 (PG_PASSWORD / PG_APP_PASSWORD / PG_MIGRATOR_PASSWORD /
#     EXAM_DATABASE_URL / EXAM_MIGRATOR_DATABASE_URL / EXAM_ADMIN_PASSWORD), 不进镜像
#   - 最小权限角色 (initdb 由 scripts/pg-bootstrap-prod.sh 自动创建):
#     exam_app 运行态 (DML) / exam_migrator 一次性迁移 (DDL+DML)
#   - exam 默认只绑 127.0.0.1:8000, 由反代 (Caddy/nginx) 提供 TLS 和域名
#   - worker 默认 1 实例; 扩容: docker compose -f docker-compose.prod.yml up -d --scale worker=3
#     (worker 单进程单线程轮询, 并行度 = 实例数; 每实例 WORKER_ID 需不同)
#   - 迁移是复用 exam 镜像的一次性任务, 不常驻

name: examsystem-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # superuser 仅用于 initdb 建角色; 应用/迁移分别走最小权限角色
      POSTGRES_USER: ${PG_USER:-exam_super}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD 必填 (生产强密码)}
      POSTGRES_DB: ${PG_DB:-exam_system}
      # initdb 脚本用 (scripts/pg-bootstrap-prod.sh 创建最小权限角色)
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?PG_APP_PASSWORD 必填}
      PG_MIGRATOR_PASSWORD: ${PG_MIGRATOR_PASSWORD:?PG_MIGRATOR_PASSWORD 必填}
    volumes:
      # PG18 镜像: VOLUME=/var/lib/postgresql, PGDATA=/var/lib/postgresql/18/docker.
      # 必须挂整个 /var/lib/postgresql; 挂 /var/lib/postgresql/data 会让真实数据
      # 落匿名卷 (命名卷 pg_data 为空), 换机/升级时丢数据.
      - pg_data:/var/lib/postgresql
      # 首次初始化自动建 exam_app / exam_migrator (幂等; 凭据来自 .env 环境变量)
      - ./scripts/pg-bootstrap-prod.sh:/docker-entrypoint-initdb.d/10-bootstrap-prod.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-exam_super} -d ${PG_DB:-exam_system}"]
      interval: 5s
      timeout: 3s
      retries: 10
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-1g}
          cpus: "${PG_CPUS:-1.0}"
    # 默认不映射宿主端口 (仅内网可达); 需要外部 psql 时取消注释
    # ports:
    #   - "127.0.0.1:5433:5432"

  exam:
    build: .
    image: ${EXAM_IMAGE:-examsystem:latest}
    restart: unless-stopped
    init: true
    ports:
      - "${EXAM_BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      - ${EXAM_CONFIG_FILE:-./config.production.yaml}:/app/config.yaml:ro
      # data/ 与 logs/ 必须 chown 给容器 uid 10001 (镜像内非 root 用户), 否则写入失败:
      #   sudo chown -R 10001:10001 data logs
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      # 最高优先级, 覆盖 config.yaml 的 database.url
      EXAM_DATABASE_URL: ${EXAM_DATABASE_URL:?EXAM_DATABASE_URL 必填}
      # 迁移专用角色 (exam_migrator, DDL+DML): 仅 migrate 子命令消费, serve 忽略
      EXAM_MIGRATOR_DATABASE_URL: ${EXAM_MIGRATOR_DATABASE_URL:?EXAM_MIGRATOR_DATABASE_URL 必填}
      EXAM_ADMIN_PASSWORD: ${EXAM_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${EXAM_MEM_LIMIT:-512m}
          cpus: "${EXAM_CPUS:-1.0}"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WORKER_EXTRAS: ${WORKER_EXTRAS:-}
    image: ${WORKER_IMAGE:-examsystem-worker:latest}
    restart: unless-stopped
    init: true
    volumes:
      # 快照 data/exam_runs 与 Go 侧同一卷; 路径与 DB 中 snapshot_path 一致
      - ./data:/app/data:ro
      - ${RERANKER_MODEL_DIR:-./models}:/models:ro
    environment:
      # worker 读 DATABASE_URL (注意与 Go 服务的 EXAM_DATABASE_URL 变量名不同)
      DATABASE_URL: ${EXAM_DATABASE_URL}
      WORKER_ID: ${WORKER_ID:-worker-1}
      MULTIPLE_CHOICE_PARTIAL: ${MULTIPLE_CHOICE_PARTIAL:-true}
      RERANK_USE_REMOTE: ${RERANK_USE_REMOTE:-false}
      RERANK_API_URL: ${RERANK_API_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      SCORING_METHOD: ${SCORING_METHOD:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-/models/bge-reranker-v2-m3}
      HF_HOME: ${HF_HOME:-/models/hf-cache}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-1.0}
      LEASE_SECONDS: ${LEASE_SECONDS:-60}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-15}
      MAX_SCORE: ${MAX_SCORE:-100.0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 轻量 DB 探活 (不加载评分模型); 本地模型模式首启加载慢, start_period 放宽
      test: ["CMD", "python", "-m", "scoring_worker", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-4g}
          cpus: "${WORKER_CPUS:-2.0}"

volumes:
  pg_data:
