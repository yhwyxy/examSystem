[project]
name = "examsystem"
version = "1.0.0"
description = "企业在线考试兼批改系统 MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "qrcode[pil]>=7.4",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "subjective-scoring[remote]",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
scoring = [
    "subjective-scoring[text,sql,code,remote]",
]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
subjective-scoring = { git = "https://github.com/yhwyxy/subjective-scoring", tag = "v0.1.7" }
