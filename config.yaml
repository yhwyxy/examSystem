server:
  host: "0.0.0.0"
  port: 8000
  allow_origins: ["*"]

exam:
  title: "企业内部考试"
  duration_minutes: 60
  auto_submit: true
  grace_period_seconds: 30
  allow_duplicate_submit: false
  duplicate_key: "employee_id"
  enable_global_time_window: false
  start_time: null
  end_time: null

scoring:
  multiple_choice_partial: true
  wrong_choice_penalty: false
  score_precision: 1

review:
  high_confidence_threshold: 0.75
  need_review_threshold: 0.5
  low_confidence_threshold: 0.35

# 判分流程：主观题由 subjective-scoring 处理（模型参数见该服务 / 环境变量）
grading:
  sync_grading: true

# 本地模型配置
model:
  reranker: "models/models--BAAI--bge-reranker-v2-m3/snapshots/953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"

admin:
  enable_auth: false
  password: null

export:
  format: "xlsx"

# --- Go 服务新增段 (Task 1) ---
# 数据库连接：生产通过 EXAM_DATABASE_URL 注入；本地为空时 serve/preflight 必失败
database:
  url: ""
  max_conns: 32
  min_conns: 4
  connect_timeout_seconds: 5
  statement_timeout_seconds: 10

# 草稿节流：客户端写草稿最小间隔，避免高频冲刷
draft:
  min_server_interval_ms: 2000
  max_json_bytes: 512000

# 后台 Worker：扫表-锁租约-评分-心跳
worker:
  poll_interval_ms: 200
  concurrency: 2
  lease_seconds: 300
  heartbeat_seconds: 60
  max_attempts: 5

# 日志目录（相对项目根或绝对路径）
logging:
  directory: "logs"
