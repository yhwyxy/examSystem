server:
  host: "0.0.0.0"
  port: 8000
  allow_origins: ["*"]

exam:
  title: "企业内部考试"
  duration_minutes: 60
  auto_submit: true
  grace_period_seconds: 30
  allow_duplicate_submit: false
  duplicate_key: "employee_id"
  enable_global_time_window: false
  start_time: null
  end_time: null

scoring:
  multiple_choice_partial: true
  wrong_choice_penalty: false
  score_precision: 1

review:
  high_confidence_threshold: 0.75
  need_review_threshold: 0.5
  low_confidence_threshold: 0.35

# 判分配置（仅使用 Embedding 模型）
grading:
  sync_grading: true
  # Ollama Embedding 配置
  embedding:
    model: "bge-m3"          # Ollama embedding 模型名
    device: "cpu"

admin:
  enable_auth: false
  password: null

export:
  format: "xlsx"
